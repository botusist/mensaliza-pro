# Cole em Website > menasaliza.botusist.net.br > Config apenas se o template Laravel do aaPanel não tiver criado estas regras.
root /www/wwwroot/menasaliza.botusist.net.br/public;
index index.php;

location / {
    try_files $uri $uri/ /index.php?$query_string;
}

location ~ \.php$ {
    try_files $uri =404;
    include fastcgi_params;
    fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
    fastcgi_pass unix:/tmp/php-cgi-83.sock;
}

location ~ /\.(?!well-known).* {
    deny all;
}

location ~* \.(?:env|log|sql|sqlite|bak)$ {
    deny all;
}
